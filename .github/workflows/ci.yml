name: CI

# Builds and tests on both systems the app runs on.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # The Linux runner has everything the window needs except what a minimal install lacks.
      - name: Build everything
        run: dotnet build PlayerDBSync.slnx -c Release

      - name: Test
        run: dotnet test PlayerDBSync.Tests/PlayerDBSync.Tests.csproj -c Release --no-build
