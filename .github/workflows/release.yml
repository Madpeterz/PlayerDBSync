name: Release

# Push a tag like v1.2.3 to build PlayerDBSync.exe and publish it as a GitHub release.
# Tags with a suffix (v1.2.3-beta) are marked as pre-releases.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Self-contained single file, so users don't need the .NET runtime installed.
      - name: Publish
        run: >
          dotnet publish PlayerDBSync.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - uses: softprops/action-gh-release@v2
        with:
          files: publish/PlayerDBSync.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
