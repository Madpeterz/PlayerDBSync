name: Release

# Push a tag like 1.2.3 (or v1.2.3) to build PlayerDBSync.exe (Windows) and PlayerDBSync-linux-x64.tar.gz (Linux)
# and publish them as a GitHub release. Tags with a suffix (1.2.3-beta) are marked as pre-releases.
on:
  push:
    tags:
      - "v[0-9]*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Self-contained single file, so users don't need the .NET runtime installed.
      - name: Publish
        run: >
          dotnet publish PlayerDBSync.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: publish/PlayerDBSync.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test PlayerDBSync.Tests/PlayerDBSync.Tests.csproj -c Release

      # The cross-platform (Avalonia) app, self-contained single file as the Windows one is.
      - name: Publish
        run: >
          dotnet publish PlayerDBSync.Avalonia/PlayerDBSync.Avalonia.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      # A tarball keeps the executable bit, which a plain download of the file would lose.
      - name: Package
        run: |
          mv publish/PlayerDBSync.Avalonia publish/PlayerDBSync
          chmod +x publish/PlayerDBSync
          tar -czf PlayerDBSync-linux-x64.tar.gz -C publish PlayerDBSync

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: PlayerDBSync-linux-x64.tar.gz
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/PlayerDBSync.exe
            assets/PlayerDBSync-linux-x64.tar.gz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
